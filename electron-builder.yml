appId: com.founderos.app
productName: FounderOS
copyright: Copyright © 2026

# Disabled because the embedded Next.js server spawns a child process
# whose cwd must be a real filesystem path. Inside an asar archive,
# next start cannot read .next/ files or set cwd, causing the window
# to hang on a loading state forever.
asar: false

directories:
  output: dist-electron

files:
  - "electron/**/*"
  - "public/**/*"
  - "src/**/*"
  - ".next/**/*"
  - "node_modules/**/*"
  - "package.json"
  - "next.config.mjs"
  - ".env.local"

win:
  target:
    - nsis
  icon: public/favicon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: FounderOS
  installerIcon: public/favicon.ico
  uninstallerIcon: public/favicon.ico

mac:
  target:
    - dmg
  icon: public/favicon.ico

linux:
  target:
    - AppImage
  icon: public/favicon.ico

publish:
  provider: github
  owner: cryptochris8
  repo: founderos

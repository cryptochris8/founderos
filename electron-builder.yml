appId: com.founderos.app
productName: FounderOS
copyright: Copyright © 2026

directories:
  output: dist-electron

files:
  - "electron/**/*"
  - "public/**/*"
  - "src/**/*"
  - ".next/**/*"
  - "node_modules/**/*"
  - "package.json"
  - "next.config.ts"
  - "tsconfig.json"
  - "postcss.config.mjs"
  - "components.json"
  - ".env.local"

win:
  target:
    - nsis
  icon: public/favicon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: public/favicon.ico
  uninstallerIcon: public/favicon.ico

mac:
  target:
    - dmg
  icon: public/favicon.ico

linux:
  target:
    - AppImage
  icon: public/favicon.ico

publish:
  provider: github
  owner: cryptochris8
  repo: founderos

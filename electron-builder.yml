appId: com.founderos.app
productName: FounderOS
copyright: Copyright © 2026

# Re-enabled: the app now ships a prebuilt static export (out/) served by an
# in-process file server, so there is no `next start` child process that needs
# a real on-disk cwd. fs reads of out/ work transparently from inside the asar.
asar: true

directories:
  output: dist-electron

files:
  # The packaged app is just the Electron shell + the static export. The web
  # app's deps are compiled into out/, and electron-builder auto-includes the
  # (now tiny) production dependencies — electron-updater + shell-quote.
  - "electron/**/*"
  - "out/**/*"
  - "package.json"

win:
  target:
    - nsis
  icon: public/favicon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: FounderOS
  installerIcon: public/favicon.ico
  uninstallerIcon: public/favicon.ico

mac:
  target:
    - dmg
  icon: public/favicon.ico

linux:
  target:
    - AppImage
  icon: public/favicon.ico

publish:
  provider: github
  owner: cryptochris8
  repo: founderos
